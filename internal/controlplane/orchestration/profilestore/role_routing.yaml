implementer:
  broad: &opus_first
    - {runtime: claude, provider: claude-subscription, model: claude-opus-5-5}
    - {runtime: codex, provider: codex-subscription, model: gpt-6.2-sol}
  narrow:
    - {runtime: codex, provider: codex-subscription, model: gpt-6.2-sol}
    - {runtime: claude, provider: claude-subscription, model: claude-opus-5-5}
  quick: &flash_trial
    - {runtime: claude, provider: claude-subscription, model: claude-sonnet-5-5}
    - {runtime: omp, provider: opencode-go, model: deepseek-v4.1-flash}
    - {runtime: omp, provider: opencode-go, model: glm-5.3-flash}
planner: {broad: *opus_first, narrow: *opus_first, quick: *opus_first}
explorer: {broad: *flash_trial, narrow: *flash_trial, quick: *flash_trial}
reviewer:
  broad: &independent
    - {runtime: codex, provider: codex-subscription, model: gpt-6.2-sol}
    - {runtime: claude, provider: claude-subscription, model: claude-opus-5-5}
    - {runtime: omp, provider: opencode-go, model: deepseek-v4.1-flash}
  narrow: *independent
  quick: *independent
