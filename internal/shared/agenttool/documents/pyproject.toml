# The documents environment the Bots' document skills run in (issue #401): the pins of the Hermes pdf skill's own
# venv (skills/productivity/pdf/SKILL.md at 022a14437b2d), as Hermes declares them in its `documents` and
# `documents-pdf` extras (pyproject.toml). The project is written as Hermes writes a side environment's
# (pm/operations.py, ensure_environment); uv.lock beside it pins every package's files by their hashes. Change a pin
# here, then run `uv lock` with the uv of agenttool.UV() in this folder.
[project]
name = "hypomnema-documents"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
  "reportlab==5.1.0",
  "pypdf==6.21.4",
  "pdfplumber==0.11.10",
  "pypdfium2==5.14.0",
]

[tool.uv]
package = false
