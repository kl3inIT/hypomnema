            id when left out.
        title: { type: string, maxLength: 200 }
        provider: { type: string, description: Where the model is found. }
        model: { type: string, description: The chat's own model; its Bot's when left out. }
        effort: { type: string, description: The chat's own effort; its Bot's when left out. }
    ChatDeleted:
      type: object
      additionalProperties: false
      required: [files_left]
      description: What a chat's deletion left on the coordinator's machine.
      properties:
        files_left:
          type: array
          items: { type: string }
          description: >-
            Each of the chat's files that could not be removed, with why; empty when all of them went. The chat is
            deleted all the same.
    ChatChange:
      type: object
      additionalProperties: false
      description: A change of the model and effort a chat runs with; a field left out stays as it is.
      properties:
        provider:
          type: string
          description: Where the model is found, given with the model, which needs it (issue #1002).
        model:
          type: string
          description: The model; empty for its Bot's.
        effort:
          type: string
          description: The effort, one of none, minimal, low, medium, high, xhigh and max; empty for its Bot's.
    WorkspaceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
    Workspace:
      type: object
      required: [id, kind, name, root, online]
      properties:
        id: { type: string, description: "`bot`, or the Task's id." }
        kind: { type: string, enum: [bot, task] }
        name: { type: string, description: The Bot's name, or the first line of the Task's spec. }
        root: { type: string, description: Where the folder is on its machine. }
        online: { type: boolean, description: Whether the folder's machine can be read now. }
        node_id: { type: string }
        node_name: { type: string }
        task_id: { type: string }
        run_id: { type: string }
        task_status: { type: string }
    WorkspaceEntry:
      type: object
      required: [name, path, type, bytes, modified_at]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, directory] }
        bytes: { type: integer, format: int64 }
        modified_at: { type: integer, format: int64, description: Unix seconds. }
    WorkspaceListing:
      type: object
      required: [entries, has_more]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceEntry" }
        has_more: { type: boolean }
    WorkspaceFile:
      type: object
      required: [path, bytes, binary, truncated, content]
      properties:
        path: { type: string }
        bytes: { type: integer, format: int64 }
        binary: { type: boolean, description: A binary file has no content. }
        truncated: { type: boolean, description: The content is the first 10 MiB, cut at a character. }
        content: { type: string }
        sha256:
          type: string
          description: The whole file's SHA-256, which a write names as the text it replaces; absent past 10 MiB.
    WorkspaceWrite:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string, description: The file's whole text, at most 1 MiB. }
        expect_sha256: { type: string, description: The SHA-256 the file must still have; absent for a new file. }
    WorkspacePathBody:
      type: object
      required: [path]
      properties:
        path: { type: string }
    WorkspaceMove:
      type: object
      required: [path, to]
      properties:
        path: { type: string }
        to: { type: string }
    WorkspaceDone:
      type: object
      required: [path]
      properties:
        path: { type: string }
        sha256: { type: string, description: A written file's SHA-256. }
        upload: { type: string, description: An upload begun, which its pieces and its commit name. }
    WorkspaceUploadRef:
      type: object
      required: [path, upload]
      properties:
        path: { type: string }
        upload: { type: string }
    WorkspaceUploadChunk:
      type: object
      required: [path, upload, offset, data]
      properties:
        path: { type: string }
        upload: { type: string }
        offset: { type: integer, format: int64 }
        data: { type: string, format: byte, description: The piece, at most 384 KiB, in base64. }
    WorkspaceUploadCommit:
      type: object
      required: [path, upload]
      properties:
        path: { type: string }
        upload: { type: string }
        expect_sha256: { type: string, description: The SHA-256 of the file it replaces; absent for a new one. }
    WorkspaceChange:
      type: object
      required: [path, status, modified_at]
      properties:
        path: { type: string }
        status: { type: string, enum: [created, modified, deleted] }
        lines_added: { type: integer }
        lines_removed: { type: integer }
        modified_at: { type: integer, format: int64 }
    WorkspaceChanges:
      type: object
      required: [git, changes, truncated]
      properties:
        git: { type: boolean, description: False for a folder in no git repository, which has no changes. }
        changes:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceChange" }
        truncated: { type: boolean }
    WorkspaceDiff:
      type: object
      required: [path, binary]
      properties:
        path: { type: string }
        before: { type: string, description: The file at HEAD; absent when it was created. }
        after: { type: string, description: The file now; absent when it was deleted. }
        binary: { type: boolean }
    Chat:
      type: object
      required: [id, title, bot, working, coordinator, routine, channel, created_at, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        bot: { type: string, description: The id of the Bot the chat talks with. }
        read_run: { type: boolean, description: This chat belongs to a read-only Routine run. }
        provider:
          type: string
          description: Where the chat's own model is found; absent with the model.
        model:
          type: string
          description: The chat's own model (issue #369); absent when it runs with its Bot's.
        effort:
          type: string
          description: The chat's own effort, one of the model gateway's levels; absent when it is its Bot's.
        working:
          type: boolean
          description: The coordinator is working on a turn of this chat.
        coordinator:
          type: boolean
          description: A coordinator is configured to answer; false means messages are kept and nothing answers.
        context_usage: { $ref: "#/components/schemas/ChatContextUsage" }
        last_line:
          type: string
          description: >-
            The first line of its latest message of the owner or its Bot, at most 120 characters (issue #471); in a
            list only, absent before either wrote.
        routine:
          type: boolean
          description: >-
            The chat was opened for a Routine's run (issue #923); it is never its Bot's main chat.
        channel:
          type: boolean
          description: >-
            A Lark chat (issue #923): a person's or a group's at a Channel, one someone other than the owner wrote
            in, or another person's from before sender ids (titled "Lark: <name>", with Lark's "[Lark message from
            <name>, who is not the owner. …]" label in its lines); it is never its Bot's main chat.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChatContextUsage:
      type: object
      description: >-
        How full the chat's context window is, as pi last reported it after a turn or a compaction (issue #384; pi's
        get_session_stats). Absent from a chat before pi first reported it.
      required: [context_window, reserve_tokens]
      properties:
        context_window:
          type: integer
          format: int64
          description: The model's context window in tokens; pi compacts on its own at this less reserve_tokens.
        reserve_tokens:
          type: integer
          format: int64
          description: >-
            The tokens pi keeps free, the reserve the chat's pi is given for this window: max(15% of the window,
            16384) (issues #395, #1009). pi compacts on its own once fewer are free.
        tokens:
          type: integer
          format: int64
          description: The tokens in pi's context; absent right after a compaction, until pi's next answer.
        percent:
          type: number
          format: double
          description: The share of the window used, 0 to 100; absent with tokens.
    ChatList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Chat" }
    ChatRole:
      type: string
      description: >-
        owner: typed by the owner; coordinator: pi's reply; tool: a tool pi
        ran, with its result; system: a wake-up or a notice.
      enum: [owner, coordinator, tool, system]
    ChatKind:
      type: string
      description: >-
        What a system message is: wake, a wake-up for an event of one of the
        chat's Runs; failed, pi's model call failed; stopped, the owner stopped
        the turn; approval, the coordinator is told the owner answered an
        Approval; artifact, an artifact a Bot showed, which its next
        revision updates; continued, the control plane restarted and woke
        the Bot to continue the turn the restart cut; cut, a restart cut the
        turn and it is not continued.
      enum: [wake, failed, stopped, approval, artifact, continued, cut]
    ChatPart:
      type: object
      description: >-
        One piece of a reply (text, thinking), of a tool pi ran
        (tool_result), or the result of a Routine's run told in the chat it
        was made in (routine_run: id is the run's).
      required: [type]
      properties:
        type: { type: string, enum: [text, thinking, tool_result, routine_run] }
        routine_id: { type: string, description: "The Routine of a routine_run part." }
        text: { type: string }
        id: { type: string, description: The tool call. }
        name: { type: string, description: The tool. }
        args:
          type: object
          additionalProperties: true
          description: The tool's arguments.
        output: { type: string, description: "The tool's result, at most 16 KiB." }
        error: { type: boolean }
        truncated: { type: boolean, description: The output was cut. }
        duration_ms: { type: integer, format: int64 }
    ChatDelta:
      type: object
      description: Text or thinking pi is writing, to append to block index of the current reply.
      required: [kind, index, delta]
      properties:
        kind: { type: string, enum: [text, thinking] }
        index: { type: integer }
        delta: { type: string }
    ChatToolActivity:
      type: object
      description: A tool started (with its name and arguments) or ended.
      required: [phase, id]
      properties:
        phase: { type: string, enum: [start, end] }
        id: { type: string }
        name: { type: string }
        args:
          type: object
          additionalProperties: true
    ChatGatewayKey:
      type: object
      required: [key]
      properties:
        key: { type: string }
    ChatState:
      type: object
      required: [working]
      properties:
        working: { type: boolean }
    QueuedChatMessage:
      type: object
      description: An owner message that waits for the coordinator's turn to settle (issue #497).
      required: [id, chat_id, text, created_at]
      properties:
        id: { type: integer, format: int64 }
        chat_id: { type: string }
        text: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/ChatAttachment" }
        created_at: { type: string, format: date-time }
    QueuedChatMessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QueuedChatMessage" }
    NewChatMessage:
      type: object
      description: The owner's message; its text may be empty when it carries files.
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 100000 }
        attachments:
          type: array
          description: Files uploaded into the chat's Bot's folder for this message.
          items: { $ref: "#/components/schemas/ChatAttachment" }
    ArtifactType:
      type: string
      description: >-
        How an artifact is shown, found from its bytes and name: html, a page
        in a locked frame; pdf; image; file, to download.
      enum: [html, pdf, image, file]
      x-enum-varnames: [ArtifactHTML, ArtifactPDF, ArtifactImage, ArtifactFileType]
    ArtifactCard:
      type: object
      required: [id, revision, title, type, updated_at]
      properties:
        id: { type: string }
        revision: { type: integer }
        title: { type: string }
        type: { $ref: "#/components/schemas/ArtifactType" }
        updated_at: { type: string, format: date-time }
    ArtifactFileInfo:
      type: object
      required: [path, size, media_type]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        media_type: { type: string }
    ArtifactRevision:
      type: object
      required: [revision, title, type, entry, size, files, created_at]
      properties:
        revision: { type: integer }
        title: { type: string }
        type: { $ref: "#/components/schemas/ArtifactType" }
        entry:
          type: string
          description: The file shown, index.html of a folder or the one file.
        size: { type: integer, format: int64 }
        files:
          type: array
          items: { $ref: "#/components/schemas/ArtifactFileInfo" }
        created_at: { type: string, format: date-time }
    Artifact:
      type: object
      required: [id, chat_id, bot, revision, title, type, entry, size, created_at, updated_at]
      properties:
        id: { type: string }
        chat_id: { type: string }
        bot:
          type: string
          description: The id of the Bot that showed it.
        revision:
          type: integer
          description: The newest revision.
        title: { type: string }
        type: { $ref: "#/components/schemas/ArtifactType" }
        entry: { type: string }
        size: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revisions:
          type: array
          description: Every revision kept, newest first; only when one artifact is read.
          items: { $ref: "#/components/schemas/ArtifactRevision" }
    ArtifactList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
    SheetList:
      type: object
      description: >-
        A workbook as CSV text a sheet (issue #422): each sheet cut at
        500,000 characters, all of them at 2,000,000, at most 50 sheets.
      required: [sheets, truncated]
      properties:
        sheets:
          type: array
          items: { $ref: "#/components/schemas/Sheet" }
        truncated:
          type: boolean
          description: Sheets past the first 50 were left out; the download holds them.
    Sheet:
      type: object
      required: [name, csv, truncated]
      properties:
        name: { type: string }
        csv:
          type: string
          description: >-
            The sheet's rows as RFC 4180 CSV, one line a sheet row, a row the
            sheet never stored as an empty line.
        truncated:
          type: boolean
          description: >-
            Rows past the sheet's 500,000 characters, or past what the
            workbook's 2,000,000 left for it, were left out; the download
            holds them.
    ArtifactFrame:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The folder's path on this server, ending in "/".
    NewArtifactShare:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: Whom the link is for, one line of at most 80 characters, such as "Laura".
    ArtifactShare:
      type: object
      required: [id, artifact_id, label, token, path, created_at, views]
      properties:
        id: { type: string }
        artifact_id: { type: string }
        label: { type: string }
        token:
          type: string
          description: The link's secret, 32 random bytes in base64url.
        path:
          type: string
          description: The link's path on this server, /s/<token>.
        created_at: { type: string, format: date-time }
        views:
          type: integer
          format: int64
          description: How many times its page was opened.
        last_viewed_at: { type: string, format: date-time }
    ArtifactShareList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ArtifactShare" }
    SharedLink:
      type: object
      description: A view-only link with what it shows (issue #765).
      required: [id, artifact_id, label, token, path, created_at, views, title, type, bot, bot_name, chat_id]
      properties:
        id: { type: string }
        artifact_id: { type: string }
        label: { type: string }
        token:
          type: string
          description: The link's secret, 32 random bytes in base64url.
        path:
          type: string
          description: The link's path on this server, /s/<token>.
        created_at: { type: string, format: date-time }
        views:
          type: integer
          format: int64
          description: How many times its page was opened.
        last_viewed_at: { type: string, format: date-time }
        title:
          type: string
          description: The artifact's newest title.
        type: { $ref: "#/components/schemas/ArtifactType" }
        bot:
          type: string
          description: The id of the Bot that made the artifact.
        bot_name:
          type: string
          description: That Bot's name; empty when the Bot is gone.
        chat_id:
          type: string
          description: The chat the artifact is in.
    SharedLinkList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SharedLink" }
    SharedArtifact:
      type: object
      required: [title, type, entry, media_type, revision, updated_at, files]
      properties:
        title: { type: string }
        type: { $ref: "#/components/schemas/ArtifactType" }
        entry:
          type: string
          description: The file shown, index.html of a folder or the one file.
        media_type:
          type: string
          description: The type of the file shown.
        revision:
          type: integer
          description: The newest revision; the page reloads when it changes.
        updated_at: { type: string, format: date-time }
        files:
          type: string
          description: The path its files load from, ending in "/".
    ChatAttachment:
      type: object
      description: >-
        A file the owner attached to a message (issue #343): uploaded into
        the chat's Bot's folder, where pi reads it.
      required: [name, path, size]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255, description: "The file's name as the owner picked it." }
        path:
          type: string
          maxLength: 1024
          description: "Where it is in the Bot's folder: attachments/<chat id>/<file>."
        size: { type: integer, format: int64, minimum: 0 }
        type: { type: string, maxLength: 255, description: "Its media type, when the browser named one." }
    ChatMessage:
      type: object
      required: [seq, chat_id, role, text, created_at]
      properties:
        seq: { type: integer, format: int64 }
        chat_id: { type: string }
        role: { $ref: "#/components/schemas/ChatRole" }
        kind:
          $ref: "#/components/schemas/ChatKind"
          description: What a system message is; absent for other messages.
        text: { type: string }
        parts:
          type: array
          description: A reply's text and thinking, or a tool's result; absent for owner and system messages.
          items: { $ref: "#/components/schemas/ChatPart" }
        attachments:
          type: array
          description: The files of an owner message; absent for other messages.
          items: { $ref: "#/components/schemas/ChatAttachment" }
        event_seq:
          type: integer
          format: int64
          description: The event a wake-up reports.
        wake:
          $ref: "#/components/schemas/ChatWake"
          description: What the event of a wake row says; absent for other messages.
        artifact:
          $ref: "#/components/schemas/ArtifactCard"
          description: The artifact an artifact row shows, as it is now; absent for other messages.
        approval_id:
          type: string
          description: The Approval an approval row answers; absent for other messages.
        approval:
          $ref: "#/components/schemas/ChatApproval"
          description: What an approval row's Approval asked and how the owner answered; absent for other messages.
        delivered_at:
          type: string
          format: date-time
          description: When the coordinator got an owner message or a wake-up.
        created_at: { type: string, format: date-time }
    ChatApproval:
      type: object
      description: >-
        An Approval asked in the chat, as the owner answered it: what was asked, the answer, how far an approval
        reaches and when it was given. It no longer changes.
      required: [title, action_name, status]
      properties:
        title: { type: string }
        action_name: { type: string }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        scope:
          type: string
          enum: [once, session, routine]
          description: How far an approval reaches; absent for a rejection.
        decided_at: { type: string, format: date-time }
    ChatWake:
      type: object
      description: >-
        The event a wake-up reports, read from the event, which never changes:
        a Task ended or was blocked, a worker asked the coordinator a question,
        an escalation, or a Run ended.
      required: [event]
      properties:
        event:
          type: string
          enum: [task.status, question.opened, escalation, run.finished, run.canceled]
          x-enum-varnames: [WakeTaskStatus, WakeQuestionOpened, WakeEscalation, WakeRunFinished, WakeRunCanceled]
        run_id: { type: string }
        task_id: { type: string }
        question_id: { type: string }
        status:
          type: string
          description: >-
            What the Task became (succeeded, failed, blocked, canceled), or how
            the Run ended (finished, canceled); absent for a question or an
            escalation.
        reason: { type: string, description: "Why the Task is blocked or failed, or the escalation's reason." }
        escalation: { type: string, description: "The escalation's kind, such as stalled or overrun." }
    ChatMessageList:
      type: object
      required: [data, next_after, has_more]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        next_after:
          type: integer
          format: int64
          description: The cursor for the next page, the newest seq read; a message the Bot hides is counted.
        next_before:
          type: integer
          format: int64
          description: >-
            With before, the cursor for the page older than this one: the oldest seq read, a message the Bot hides
            included.
        has_more:
          type: boolean
          description: With before, whether older messages are left; always false with after.
    MeetingState:
      type: string
      description: Where the meeting's transcription stands; a live meeting is recording until it ends.
      enum: [recording, transcribing, transcribed, failed]
    MeetingSource:
      type: string
      description: How the meeting came, uploaded or recorded live.
      enum: [upload, live]
    MeetingKind:
      type: string
      description: How a live meeting is held; online records the microphone and a shared tab.
      enum: [online, in_person]
    MeetingTrack:
      type: string
      description: What a voice was heard on, an upload's file or a live meeting's microphone or shared tab.
      enum: [file, mic, tab]
    MeetingLiveTrack:
      type: string
      enum: [mic, tab]
    NewLiveMeeting:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/MeetingKind" }
        language:
          type: string
          description: An ISO 639-1 code, such as vi; absent, the provider finds it.
          pattern: "^[a-z]{2}$"
        title: { type: string, maxLength: 200, description: Absent, the notes write one. }
        people:
          type: array
          description: Who is in the meeting; they help name the speakers.
          maxItems: 30
          items: { type: string, maxLength: 100 }
    MeetingTrackRequest:
      type: object
      required: [track]
      additionalProperties: false
      properties:
        track: { $ref: "#/components/schemas/MeetingLiveTrack" }
    MeetingNotesState:
      type: string
      description: Where its notes stand; waiting is for the transcript.
      enum: [waiting, writing, ready, failed]
    MeetingSection:
      type: object
      required: [title, points]
      properties:
        title: { type: string }
        points: { type: array, items: { type: string } }
    MeetingNotes:
      type: object
      required: [state, summary, sections]
      properties:
        state: { $ref: "#/components/schemas/MeetingNotesState" }
        failure: { type: string, description: Why writing them failed, and where to fix it. }
        model: { type: string, description: The gateway model that wrote them. }
        summary: { type: string }
        sections:
          type: array
          description: A section per topic the meeting discussed, in the order they came up.
          items: { $ref: "#/components/schemas/MeetingSection" }
        written_at: { type: string, format: date-time }
    MeetingSpeaker:
      type: object
      required: [track, label, name, named, owner, talk_ms, share]
      properties:
        track: { $ref: "#/components/schemas/MeetingTrack" }
        label:
          type: string
          description: The voice's label on its track, the provider's or m1, m2… for one the owner made.
        owner: { type: boolean, description: The owner's own voice, an online meeting's microphone, shown as You. }
        name: { type: string, description: The name shown, Speaker N until the owner names it. }
        named: { type: boolean }
        talk_ms: { type: integer, format: int64, description: How long its lines last. }
        share: { type: number, description: Its share of the meeting's talk, 0 to 1. }
    Meeting:
      type: object
      required:
        - id
        - title
        - titled
        - people
        - file_name
        - media_type
        - size
        - duration_ms
        - state
        - source
        - created_at
        - notes
        - speakers
        - actions
        - open_actions
      properties:
        id: { type: string }
        title: { type: string }
        titled: { type: boolean, description: The owner gave the title; otherwise the notes wrote it. }
        language: { type: string }
        people: { type: array, items: { type: string } }
        file_name: { type: string }
        media_type: { type: string }
        size: { type: integer, format: int64 }
        duration_ms:
          type: integer
          format: int64
          description: Its length; while it records, what is kept so far, where a resumed recording goes on.
        state: { $ref: "#/components/schemas/MeetingState" }
        source: { $ref: "#/components/schemas/MeetingSource" }
        kind: { $ref: "#/components/schemas/MeetingKind" }
        failure: { type: string, description: Why hearing it failed, and where to fix it. }
        provider: { type: string, description: The speech-to-text provider that heard it. }
        model: { type: string }
        created_at: { type: string, format: date-time }
        notes: { $ref: "#/components/schemas/MeetingNotes" }
        speakers: { type: array, items: { $ref: "#/components/schemas/MeetingSpeaker" } }
        actions: { type: integer }
        open_actions: { type: integer }
    MeetingList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Meeting" }
    MeetingLine:
      type: object
      required: [n, track, start_ms, end_ms, speaker, heard, text]
      properties:
        n: { type: integer, description: The line's number, its id; lines are listed by when they were said. }
        track: { $ref: "#/components/schemas/MeetingTrack" }
        start_ms: { type: integer, format: int64 }
        end_ms: { type: integer, format: int64 }
        speaker: { type: string, description: The label of the voice it is shown as, on the line's track. }
        heard: { type: string, description: The label the provider heard it as. }
        text: { type: string }
    MeetingItemKind:
      type: string
      enum: [decision, action]
    MeetingItem:
      type: object
      required: [id, kind, text, done]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/MeetingItemKind" }
        text: { type: string }
        owner: { type: string, description: Who does an action, as shown. }
        owner_speaker: { type: string, description: The label of the voice that does it, when it is one. }
        owner_track: { $ref: "#/components/schemas/MeetingTrack" }
        due: { type: string, description: The deadline in the words the meeting used. }
        done: { type: boolean }
        quote: { type: string, description: The sentence it rests on. }
        line: { type: integer, description: The line it rests on. }
        start_ms: { type: integer, format: int64, description: When that line was said. }
    SpeakerSuggestion:
      type: object
      required: [track, label, name, line]
      properties:
        track: { $ref: "#/components/schemas/MeetingTrack" }
        label: { type: string }
        name: { type: string, description: The name the voice called itself. }
        line: { type: integer, description: The line it said it in. }
    MeetingDetail:
      type: object
      required: [meeting, lines, items, suggestions]
      properties:
        meeting: { $ref: "#/components/schemas/Meeting" }
        lines: { type: array, items: { $ref: "#/components/schemas/MeetingLine" } }
        items:
          type: array
          description: The decisions, then the actions, each in the notes' order.
          items: { $ref: "#/components/schemas/MeetingItem" }
        suggestions:
          type: array
          description: Names offered for unnamed voices, from the lines they introduced themselves in.
          items: { $ref: "#/components/schemas/SpeakerSuggestion" }
    MeetingWordFix:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string, minLength: 1, maxLength: 200, description: The word as the transcript says it. }
        to: { type: string, minLength: 1, maxLength: 200, description: The word as it was said. }
        line: { type: integer, minimum: 1, description: Only this line; absent, the whole meeting. }
    MeetingWordFixed:
      type: object
      required: [detail, replaced, learned]
      properties:
        detail: { $ref: "#/components/schemas/MeetingDetail" }
        replaced: { type: integer, description: How many times the word was replaced. }
        learned:
          type: boolean
          description: The right word is in the owner's words to hear right; false when the list is full.
    SpeakerName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
    MeetingItemUpdate:
      type: object
      required: [done]
      additionalProperties: false
      properties:
        done: { type: boolean }
    MeetingAction:
      type: object
      required: [id, meeting_id, meeting_title, meeting_at, text, done]
      properties:
        id: { type: string }
        meeting_id: { type: string }
        meeting_title: { type: string }
        meeting_at: { type: string, format: date-time }
        text: { type: string }
        who: { type: string, description: Who does it, as shown; absent for nobody named. }
        due: { type: string }
        done: { type: boolean }
        quote: { type: string }
        start_ms: { type: integer, format: int64 }
    MeetingActionList:
      type: object
      required: [data, people]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/MeetingAction" }
        people:
          type: array
          description: Everyone who has an action, open or done, by the name shown.
          items: { type: string }
    MeetingWordSource:
      type: string
      description: >-
        Where a word comes from: the owner's list, a name the owner gave a speaker in a meeting, a Bot's name or a
        registered repository's.
      enum: [owner, speaker, bot, repository]
    MeetingWord:
      type: object
      required: [word, from, sent]
      properties:
        word: { type: string }
        from: { $ref: "#/components/schemas/MeetingWordSource" }
        sent: { type: boolean, description: A transcription is given it; false past max_sent. }
    MeetingWords:
      type: object
      required: [data, max_own, max_sent]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/MeetingWord" } }
        max_own: { type: integer, description: How many words the owner may keep. }
        max_sent: { type: integer, description: How many words a transcription is given. }
    MeetingWordsUpdate:
      type: object
      required: [words]
      additionalProperties: false
      properties:
        words:
          type: array
          maxItems: 100
          description: The owner's words, in their order.
          items: { type: string, minLength: 1, maxLength: 100 }
    MeetingSettings:
      type: object
      required: [notes_model]
      properties:
        notes_model: { type: string, description: The gateway chat model that writes notes; empty for none. }
    MeetingSettingsUpdate:
      type: object
      required: [notes_model]
      additionalProperties: false
      properties:
        notes_model: { type: string, maxLength: 100 }
    TodoState:
      type: string
      description: >-
        proposed waits for the owner; open is to be done; doing, a Bot is on it; review, the Bot's action waits for
        an Approval; done, dropped and duplicate are closed.
      enum: [proposed, open, doing, review, done, dropped, duplicate]
    TodoAssigneeKind:
      type: string
      enum: [me, person, bot, unknown]
    TodoAssignee:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/TodoAssigneeKind" }
        name: { type: string, maxLength: 100, description: The person's name or the Bot's id. }
    TodoDueKind:
      type: string
      enum: [none, unknown, date, instant]
    TodoDue:
      type: object
      required: [kind]
      description: >-
        none; unknown (due, when is not known); a calendar date in zone, with no time made up for it; or a moment
        with its zone.
      properties:
        kind: { $ref: "#/components/schemas/TodoDueKind" }
        date: { type: string, format: date, description: For a date. }
        at: { type: string, format: date-time, description: For an instant. }
        zone: { type: string, maxLength: 64, description: The IANA time zone of a date or an instant. }
    TodoLinkKind:
      type: string
      description: >-
        zalo_sent, whatsapp_sent and lark_sent are a message the owner sent himself in a chat of his own account,
        named by account, chat and its id: the evidence a Bot gives that he answered.
      enum:
        [url, chat_message, mail, run, pull_request, meeting_line, lark_message, zalo_message, whatsapp_message,
         zalo_sent, whatsapp_sent, lark_sent]
    TodoLink:
      type: object
      required: [kind, ref]
      description: A typed reference, to where an item came from or to what shows it is done.
      properties:
        kind: { $ref: "#/components/schemas/TodoLinkKind" }
        ref:
          type: string
          minLength: 1
          maxLength: 2000
          description: The URL, or the id of the message, mail, Run, pull request or meeting line; a chat message's seq.
        label: { type: string, maxLength: 300 }
        account:
          type: string
          maxLength: 200
          description: "The owner's account a message he sent was sent from; zalo_sent, whatsapp_sent, lark_sent only."
        chat:
          type: string
          maxLength: 200
          description: "The chat a message the owner sent is in, its id at the service; the *_sent kinds only."

    TodoSourceKind:
      type: string
      description: >-
        owner, written by hand; chat, a Bot in a chat with the owner; routine, a Bot in a Routine's run; lark, zalo
        and whatsapp, a Bot reading a chat of the owner's own account there; gmail, a Bot reading a thread of his
        Gmail; meeting, a Bot reading a meeting he recorded.
      enum: [owner, chat, routine, lark, zalo, whatsapp, gmail, meeting]
    TodoSource:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/TodoSourceKind" }
        id:
          type: string
          description: "The chat, the Routine's run, the chat's id at Lark, Zalo or WhatsApp, the Gmail thread's id, or the meeting."
        account:
          type: string
          description: The owner's account the chat or thread is in; zalo, whatsapp and gmail, and lark when given.
        quote: { type: string, description: The words it came from. }
        ref: { $ref: "#/components/schemas/TodoLink" }
    TodoWhyOpen:
      type: string
      description: >-
        Why an item a Bot found starts open: asked_directly, someone tagged or messaged the owner and he has not
        answered; promised, the owner promised it himself; waiting, he waits on a person, given the item: he gave it
        to them, it was promised to him, or someone took it in his place. The message that shows it is in the
        item's history (the event's after.waiting_on); giving the item to anyone else clears it.
      enum: [asked_directly, promised, waiting]
    TodoActorKind:
      type: string
      enum: [owner, bot, system]
    TodoActor:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/TodoActorKind" }
        id: { type: string, description: "The Bot's id, or what of the system." }
    TodoWork:
      type: object
      required: [attempt, kind, id, bot, started_at]
      description: The Bot's current attempt, while doing or review.
      properties:
        attempt: { type: string, description: "The attempt's own id, which the Bot's writes carry." }
        kind: { type: string, enum: [chat, run] }
        id: { type: string, description: The chat or the Routine's run the attempt works in. }
        bot: { type: string }
        started_at: { type: string, format: date-time }
    TodoEvent:
      type: object
      required: [id, at, revision, actor, kind, before, after]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        revision: { type: integer, description: The revision the change made. }
        actor: { $ref: "#/components/schemas/TodoActor" }
        kind:
          type: string
          description: >-
            created, edited, state, snoozed, linked_approval or commented: after.text is the comment, and a Bot's
            comment may carry after.files, paths in the Bot's folder read through the chat after.chat, and
            after.artifacts, the ids of Artifacts it showed (issue #1207).
        before: { type: object, additionalProperties: true, description: "The fields that changed, before." }
        after:
          type: object
          additionalProperties: true
          description: >-
            The fields that changed, after. A Bot's created or edited event that put the item in Waiting on others
            holds waiting_on too: {by, quote, ref}, the person, their words and the message of the item's own
            source that shows it (a TodoLink).
    Todo:
      type: object
      required:
        [id, revision, title, notes, done_when, draft, due, assignee, state, source, created_by, close_reason,
         evidence, stale, priority, priority_reason, created_at, updated_at]
      properties:
        id: { type: string }
        revision: { type: integer, description: "Starts at 1 and grows with every change; a change carries it." }
        title: { type: string }
        notes: { type: string }
        done_when: { type: string }
        draft: { type: string, description: The reply a Bot drafted for the owner to send himself. }
        due: { $ref: "#/components/schemas/TodoDue" }
        assignee: { $ref: "#/components/schemas/TodoAssignee" }
        state: { $ref: "#/components/schemas/TodoState" }
        snoozed_until: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/TodoSource" }
        created_by: { $ref: "#/components/schemas/TodoActor" }
        why_open: { $ref: "#/components/schemas/TodoWhyOpen" }
        work: { $ref: "#/components/schemas/TodoWork" }
        approval_id: { type: string, description: "The pending Approval it waits for, in review." }
        done_by: { $ref: "#/components/schemas/TodoAssignee" }
        recorded_by: { $ref: "#/components/schemas/TodoActor" }
        closed_how: { type: string, enum: [hand, bot, ai, time] }
        close_reason: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/TodoLink" } }
        closed_at: { type: string, format: date-time }
        duplicate_of: { type: string }
        chat_id:
          type: string
          description: "The item's own chat with the Bot it was given to, where the owner's comments reach it."
        passed_by:
          type: string
          description: >-
            The Bot the item reached its Bot through: the main Bot that passed it to a project Bot, or the project
            Bot that gave it back to the main Bot. Left out when the owner or the system gave it.
        stale:
          type: boolean
          description: A proposal nobody touched for three days, left out of the list unless asked for.
        priority: { $ref: "#/components/schemas/TodoPriority" }
        priority_reason: { type: string, description: "Why it has its priority, in a line, as who set it said it." }
        project_id:
          type: string
          description: >-
            The project it is in, a department of the sidebar by its id (issue #1188); left out when none. An item
            given to a Bot in a department, without a project, takes that department.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        events:
          type: array
          description: Its history, the oldest first; GET /inbox/{todo_id} only.
          items: { $ref: "#/components/schemas/TodoEvent" }
    TodoPriority:
      type: integer
      minimum: 0
      maximum: 4
      description: 0 no priority, 1 urgent, 2 high, 3 medium, 4 low (Linear's scale).
    TodoList:
      type: object
      required: [data, total]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Todo" } }
        total: { type: integer, description: "How many items the filter matches, every page together." }
        next_cursor: { type: string, description: Present when more items follow. }
    InboxNeedsYou:
      type: object
      required: [count]
      properties:
        count: { type: integer }
    NewTodoSource:
      type: object
      description: >-
        Where a Bot in a Routine's run found it: kind routine, or lark, zalo or whatsapp with the chat's id there,
        gmail with the thread's id, meeting with the meeting's id (and the account but for a meeting). The owner's
        and a chat's come from the token.
      properties:
        kind: { $ref: "#/components/schemas/TodoSourceKind" }
        id:
          type: string
          maxLength: 200
          description: "The chat's id at Lark, Zalo or WhatsApp, the Gmail thread's id, or the meeting's; those only."
        account:
          type: string
          maxLength: 200
          description: The owner's account the chat or thread is in; required for zalo, whatsapp and gmail.
        quote: { type: string, maxLength: 2000 }
        ref: { $ref: "#/components/schemas/TodoLink" }
    NewTodo:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        notes: { type: string, maxLength: 20000 }
        done_when: { type: string, maxLength: 1000 }
        draft: { type: string, maxLength: 20000 }
        due: { $ref: "#/components/schemas/TodoDue" }
        assignee: { $ref: "#/components/schemas/TodoAssignee" }
        state: { type: string, enum: [open, proposed] }
        why_open: { $ref: "#/components/schemas/TodoWhyOpen" }
        source: { $ref: "#/components/schemas/NewTodoSource" }
        priority: { $ref: "#/components/schemas/TodoPriority" }
        priority_reason: { type: string, maxLength: 300 }
        project_id:
          type: string
          maxLength: 200
          description: The project it is in, a department by its id; left out for none.
    TodoChange:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1, description: The revision read; another is a conflict. }
        attempt:
          type: string
          maxLength: 200
          description: "A Bot's attempt (work.attempt), on an item in doing or review."
    TodoEdit:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        attempt: { type: string, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 300 }
        notes: { type: string, maxLength: 20000 }
        done_when: { type: string, maxLength: 1000 }
        draft: { type: string, maxLength: 20000 }
        due: { $ref: "#/components/schemas/TodoDue" }
        assignee: { $ref: "#/components/schemas/TodoAssignee" }
        priority: { $ref: "#/components/schemas/TodoPriority" }
        priority_reason:
          type: string
          maxLength: 300
          description: "Given with priority only; a priority set without one has no reason."
        project_id:
          type: string
          maxLength: 200
          description: The project to put it in, a department by its id; empty takes it out of its project.
    TodoDone:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        attempt: { type: string, maxLength: 200 }
        done_by: { $ref: "#/components/schemas/TodoAssignee" }
        reason: { type: string, maxLength: 2000 }
        evidence: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/TodoLink" } }
    TodoDrop:
      type: object
      required: [revision, reason]
      properties:
        revision: { type: integer, minimum: 1 }
        attempt: { type: string, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidence: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/TodoLink" } }
    TodoDuplicate:
      type: object
      required: [revision, of]
      properties:
        revision: { type: integer, minimum: 1 }
        of: { type: string, pattern: "^tdo_[A-Za-z0-9_]{1,60}$", description: The to-do it duplicates. }
    TodoSnooze:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        until: { type: string, format: date-time, description: "Hidden until then; absent, shown again." }
    TodoRelease:
      type: object
      required: [revision, reason]
      properties:
        revision: { type: integer, minimum: 1 }
        attempt: { type: string, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    TodoHand:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        bot: { type: string, maxLength: 200, description: "The Bot's id; absent, the main Bot." }
        prompt:
          type: string
          maxLength: 10000
          description: What the owner asks of the Bot, its first comment; optional.
    TodoComment:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 10000 }
    TodoSend:
      type: object
      required: [revision, text]
      properties:
        revision: { type: integer, minimum: 1, description: The revision read; another is a conflict and sends nothing. }
        text: { type: string, minLength: 1, maxLength: 20000, description: "What is sent: the draft as shown, edits included." }
    TodoSent:
      type: object
      required: [sent, todo]
      properties:
        sent: { $ref: "#/components/schemas/TodoLink" }
        todo: { $ref: "#/components/schemas/Todo" }
