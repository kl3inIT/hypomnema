      properties:
        kind: { type: string, enum: [add, replace, remove] }
        text:
          type: string
          description: The entry to add, or what replaces the entry found.
        match:
          type: string
          description: Part of the one entry to replace or remove.
    Profile:
      type: object
      required:
        [name, description, version_id, version, runtime, fallbacks, skills, skills_off, preset, tools, tools_off, source,
         created_at]
      properties:
        name: { type: string }
        description:
          type: string
          description: What the profile is for; empty for versions applied before descriptions.
        version_id: { type: string }
        version: { type: integer }
        runtime: { type: string }
        provider: { type: string }
        model: { type: string }
        effort: { type: string }
        instruction: { type: string }
        cpu_request_millis:
          type: integer
          format: int64
          description: >-
            What a worker of the profile asks of a node's CPU, in thousandths of a core, from its YAML's
            requests.cpu (issue #731); left out, the default for building work, 1000.
        memory_request_bytes:
          type: integer
          format: int64
          description: >-
            What a worker of the profile asks of a node's memory, from its YAML's requests.memory; left out, the
            default for building work, 3 GiB.
        skills:
          type: array
          items: { type: string }
          description: The skills its workers get beside those given to everyone.
        skills_off:
          type: array
          items: { type: string }
          description: The skills given to everyone that its workers do not get.
        preset: { $ref: "#/components/schemas/ToolPreset" }
        tool_access: { $ref: "#/components/schemas/ToolAccess" }
        tools:
          type: array
          items: { type: string }
          description: Additional Hypomnema tools or families on top of the preset. The CLI's own tools are not switched here.
        tools_off:
          type: array
          items: { type: string }
          description: The Hypomnema tools its workers never get, each a name or a family; it wins over tools.
        fallbacks:
          type: array
          items: { type: string }
