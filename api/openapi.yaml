          type: string
          enum: [no_node, no_account, accounts_cooling, needs_gateway]
          description: >-
            Why no worker can start, when `available` is false: no connected, active node has the CLI; the runtime
            has no active account on a node; every account of the runtime cools down; or the profile is Claude
            Code's and names neither a subscription nor a provider of kind `model_gateway`: a Claude Code worker runs
            only through the gateway.
        available_at:
          type: string
          format: date-time
          description: With `accounts_cooling`, when the first account is free again.
