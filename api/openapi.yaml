          type: string
          description: The entry of tools or tools_off that names every tool of the family.
        tools:
          type: array
          items: { type: string }
    ToolFamilyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ToolFamily" }
    ModelList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Model" }
    NewChat:
