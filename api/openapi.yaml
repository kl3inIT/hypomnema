            has an account that is not cooling down (none is needed for a model the gateway serves). A Claude Code
            profile must name a subscription or a provider of kind `model_gateway`, both served by the gateway. A node at its limit still counts, since the Task
            waits its turn. Given for a profile's current version; absent for a list of versions.
