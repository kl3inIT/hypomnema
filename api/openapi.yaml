        effort: { type: string }
        persona: { type: string }
        skills:
          type: array
          items: { type: string }
          description: The skills the Bot adds; left out, the Bot keeps those it has.
        skills_off:
          type: array
          items: { type: string }
          description: The skills for everyone the Bot turns off; left out, the Bot keeps those it has.
        preset:
          $ref: "#/components/schemas/ToolPreset"
          description: Left out, the Bot keeps its preset, or defaults to full when created.
        tools:
          type: array
          items: { type: string }
          description: Additional tools or families; left out, the Bot keeps those it has.
        tools_off:
          type: array
          items: { type: string }
          description: The tools the Bot turns off, each a name or a family; left out, the Bot keeps those it has.
        connections:
          $ref: "#/components/schemas/AllowList"
          description: The Connections the Bot may use; left out, the Bot keeps its list.
        workers:
          $ref: "#/components/schemas/AllowList"
          description: The worker profiles the Bot may give work to; left out, the Bot keeps its list.
        scopes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ConnectionScope" }
          description: >-
            What the Bot may reach of each Connection, as a whole: a Connection
