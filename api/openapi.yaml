            otherwise the Bot is woken with what it printed before the prompt.
        script_text: { type: string }
        every_minutes: { type: integer, minimum: 5, maximum: 1440 }
        cron:
          type: string
          description: Five fields; needs timezone.
        timezone: { type: string, description: "An IANA time zone, such as Asia/Ho_Chi_Minh." }
        timeout_seconds:
          type: integer
          minimum: 1
          description: >-
            How long a script, or a prompt's check, may run; 600 when absent.
            A prompt run works for at most an hour.
        summary: { type: string }
        chat_id:
          type: string
          maxLength: 64
          description: The chat the Routine is made in; a Bot names the chat it works in.
        announce:
          type: boolean
          description: Whether a run's result goes to that chat; it does when absent.
        from_routine:
          type: string
          maxLength: 64
          description: The Routine whose run asks, when one does; it is refused.
    RoutineUndone:
      type: object
      required: [removed]
      properties:
        removed: { type: boolean, description: The Routine was one the Bot made and is gone. }
        routine: { $ref: "#/components/schemas/Routine" }
    RoutineLaunchRequest:
      type: object
      additionalProperties: false
      required: [bot]
      properties:
        bot: { type: string, maxLength: 63, description: The id of the Bot the Routine must belong to. }
    RoutineScriptLaunch:
      type: object
      required: [script, script_text, timeout_seconds, key]
      properties:
        script: { type: string }
        script_text: { type: string }
        timeout_seconds: { type: integer }
        key: { type: string, description: "The run's key, given once." }
        resumed:
          type: boolean
          description: >-
            The run catches up a run of the Routine that a restart of the control plane cut; the script is told
            with HYPOMNEMA_ROUTINE_RESUMED=1, to check what was done already before it does it again.
    RoutineRun:
      type: object
