# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.2/configuration-schema.json
# As Omnara's api/openapi/oapi-codegen.yaml: models, a std-http strict server and the embedded spec. The client is
# for the hypomnema CLI. Regenerate with `make openapi-generate`; `make openapi-check` fails when it is stale.
package: openapi
output: internal/controlplane/clientapi/openapi/api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  client: true
  embedded-spec: true
output-options:
  skip-prune: true
  nullable-type: true
