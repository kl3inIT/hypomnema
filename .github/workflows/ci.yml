name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/ci/go.sum
      - name: Fetch main for the migration check
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: make verify
        run: make verify
      - name: govulncheck
        run: make govulncheck

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: make web-install
        run: make web-install
      - name: make web-check
        run: make web-check
      # Chromium is kept between runs, as t3code's CI keeps it: downloading it and running apt on every run was
      # most of this job, and a stalled download held a pull request for minutes.
      - name: Resolve the Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for the browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --dir web exec playwright install --only-shell chromium
      - name: Install the system packages Chromium misses
        timeout-minutes: 5
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            pnpm --dir web exec playwright install-deps chromium
          fi
      - name: make web-e2e
        timeout-minutes: 10
        run: make web-e2e
