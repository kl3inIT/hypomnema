name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push cancels its older run; each commit pushed to main has a run of its own, since a release
# is built only from a commit whose run passed (issue #334). One group for main kept one pending run and cancelled the
# others.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed (issue #129, as Coder's `changes` job): a change of documentation alone runs none of the jobs
  # below. Documentation is pushed straight to main, and ran every check until 2026-11-10.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # A file counts as code when it is neither under docs/ nor Markdown.
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'

  # The Go checks are three jobs side by side (issue #129): no reference runs them one after another, and the
  # race tests alone were most of the old Verify job. `make verify` is still the three of them, for a laptop.
  static:
    name: Static
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # Each job keeps its own build cache, as Omnara's matrix legs do: what the race detector builds is of no use
      # to the others, and one shared key would keep only the first job's.
      - name: Restore Go cache
        id: go_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-static-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum', 'tools/goose/go.sum') }}
          restore-keys: go-static-${{ runner.os }}-
      # A pull request is checked against main as it is now; a push to main against the commit before it (issue
      # #334). The refspec is forced: a shallow fetch cannot tell a fast-forward, and main's runs were refused.
      - name: Fetch what the migrations are checked against
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags --depth=1 origin "+$BEFORE:refs/remotes/origin/migration-base"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
            git update-ref refs/remotes/origin/migration-base HEAD^
          else
            git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/migration-base
          fi
      # A migration named by its time stays green on a pull request; main refuses it, so `make migration-fix` numbers
      # it before the merge (issue #954), and release.yml releases only a green commit.
      - name: make verify-static
        run: |
          timestamps=allow
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then timestamps=refuse; fi
          make verify-static MIGRATION_BASE=origin/migration-base MIGRATION_TIMESTAMPS="$timestamps"
      - name: govulncheck
        run: make govulncheck
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go_cache.outputs.cache-primary-key }}

  unit:
    name: Unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # Each job keeps its own build cache, as Omnara's matrix legs do: what the race detector builds is of no use
      # to the others, and one shared key would keep only the first job's.
      - name: Restore Go cache
        id: go_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum') }}
          restore-keys: go-unit-${{ runner.os }}-
      # The box each Bot's pi runs in (issue #260) is tested on a real bubblewrap: the runner is set up as the
      # coordinator's machine is, and the test fails rather than skips when the box cannot be made.
      - name: Set up the Bots' box
        run: sudo sh deploy/coordinator/setup-box.sh "$USER"
      # The videos are made with the control plane's pinned ffmpeg (issue #818, row 9), installed here as the control
      # plane installs it, and kept between runs while its pin is unchanged. Its ffprobe also reads the phone's takes
      # back, a decoder independent of the writer (issue #817): it is put on PATH. Ubuntu's ffmpeg was installed for
      # that until 2026-11-18, and a slow mirror timed it out at 15 minutes that day.
      - name: Restore the pinned ffmpeg cache
        id: ffmpeg_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hypomnema-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/controlplane/videos/ffmpeg/release.go', 'internal/controlplane/videos/ffmpeg/fonts/*') }}
      - name: Install the pinned ffmpeg
        timeout-minutes: 15
        run: |
          dir="$HOME/.cache/hypomnema-ffmpeg"
          ffprobe=$(go run ./internal/controlplane/videos/ffmpeg/installffmpeg "$dir" | tail -n 1)
          echo "HYPOMNEMA_FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
          dirname "$ffprobe" >> "$GITHUB_PATH"
      - name: make unit
        run: make unit
        env:
          HYPOMNEMA_BOX_TEST: required
          HYPOMNEMA_NEED_FFPROBE: required
          HYPOMNEMA_NEED_FFMPEG: required
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go_cache.outputs.cache-primary-key }}
      - name: Save the pinned ffmpeg cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ffmpeg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hypomnema-ffmpeg
          key: ${{ steps.ffmpeg_cache.outputs.cache-primary-key }}

  race:
    name: Race (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [api, clients, control-plane, other, orchestration]
        exclude:
          # This package alone took over six minutes in the old Race job. Main
          # still runs it with the race detector. All PRs run its ordinary tests.
          - group: ${{ github.event_name == 'pull_request' && 'orchestration' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        id: go_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-race-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-
            go-race-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum') }}
      - name: make race
        env:
          GROUP: ${{ matrix.group }}
        run: |
          module=$(go list -m)
          packages=$(CGO_ENABLED=1 go list -race ./...)
          selected=()
          while IFS= read -r package; do
            case "${package#"$module"/}" in
              internal/controlplane/orchestration) group=orchestration ;;
              internal/controlplane/clientapi|internal/controlplane/agentapi|internal/controlplane/nodeapi) group=api ;;
              internal/controlplane/clientcli|internal/controlplane/coordinator) group=clients ;;
              internal/controlplane|internal/controlplane/*) group=control-plane ;;
              *) group=other ;;
            esac
            if [ "$group" = "$GROUP" ]; then selected+=("$package"); fi
          done <<< "$packages"
          test "${#selected[@]}" -gt 0
          make race RACE_PACKAGES="${selected[*]}"
      - name: Save Go cache
        if: github.event_name == 'push' && steps.go_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go_cache.outputs.cache-primary-key }}

  web:
    name: Web checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
        with:
          save-cache: ${{ github.event_name == 'push' }}
      - name: make web-install web-check
        run: make web-install web-check
      - name: The Zalo bridge's tests and build
        run: make zalo-bridge-install zalo-bridge-check zalo-bridge-build
      - name: pi's extension tests
        run: make pi-extension-check

  web-build:
    name: Web build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - name: Resolve build inputs
        id: build
        run: echo "key=web-dist-${RUNNER_OS}-${RUNNER_ARCH}-$(node -v)-$(git rev-parse HEAD:web)" >> "$GITHUB_OUTPUT"
      - name: Restore the web build
        id: web_dist
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/dist
          key: ${{ steps.build.outputs.key }}
      - name: make web-install web-build
        if: steps.web_dist.outputs.cache-hit != 'true'
        run: make web-install web-build
      # The artifact makes the exact build available to every shard even on a cache miss.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-web-dist
          path: web/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Save the web build
        if: steps.web_dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/dist
          key: ${{ steps.build.outputs.key }}

  web-e2e:
    name: Web e2e (${{ matrix.shard }})
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-web-dist
          path: web/dist
      # Only server.spec needs the Go control plane and its embedded web build.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.shard == 'server'
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        if: matrix.shard == 'server'
        id: go_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-web-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-web-${{ runner.os }}-
      - name: make web-install
        run: make web-install
      # Chromium is kept between runs, as t3code's CI keeps it: downloading it and running apt on every run was
      # most of this job, and a stalled download held a pull request for minutes.
      - name: Resolve the Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium cache
        id: chromium_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for the browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --dir web exec playwright install --only-shell chromium
      - name: Install the system packages Chromium misses
        timeout-minutes: 5
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            pnpm --dir web exec playwright install-deps chromium
          fi
      - name: Run Playwright
        env:
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_PREBUILT: ${{ matrix.shard == 'server' && 'server' || 'preview' }}
        run: |
          if [ "$SHARD" = server ]; then
            pnpm --dir web test:e2e --project=server
          else
            pnpm --dir web test:e2e --project=phone --project=desktop --shard="$SHARD"
          fi
      - name: Save Go cache
        if: matrix.shard == 'server' && github.event_name == 'push' && steps.go_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go_cache.outputs.cache-primary-key }}
      - name: Save Chromium cache
        if: matrix.shard == 'server' && github.event_name == 'push' && steps.chromium_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium_cache.outputs.cache-primary-key }}

  required:
    name: Required
    needs: [changes, static, unit, race, web, web-build, web-e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check job results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ needs.static.result }} ${{ needs.unit.result }} ${{ needs.race.result }} ${{ needs.web.result }} ${{ needs.web-build.result }} ${{ needs.web-e2e.result }}
        run: |
          echo "Changes: $CHANGES, code: $CODE, results: $RESULTS"
          test "$CHANGES" = success
          case "$CODE:$RESULTS" in
            'true:success success success success success success') ;;
            'false:skipped skipped skipped skipped skipped skipped') ;;
            *) exit 1 ;;
          esac
