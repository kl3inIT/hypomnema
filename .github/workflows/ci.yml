name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed (issue #129, as Coder's `changes` job): a change of documentation alone runs none of the jobs
  # below. Documentation is pushed straight to main, and ran every check until 2026-11-10.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A file counts as code when it is neither under docs/ nor Markdown.
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'

  # The Go checks are three jobs side by side (issue #129): no reference runs them one after another, and the
  # race tests alone were most of the old Verify job. `make verify` is still the three of them, for a laptop.
  static:
    name: Static
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Each job keeps its own build cache, as Omnara's matrix legs do: what the race detector builds is of no use
      # to the others, and one shared key would keep only the first job's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-static-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum') }}
          restore-keys: go-static-${{ runner.os }}-
      - name: Fetch main for the migration check
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: make verify-static
        run: make verify-static
      - name: govulncheck
        run: make govulncheck

  unit:
    name: Unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Each job keeps its own build cache, as Omnara's matrix legs do: what the race detector builds is of no use
      # to the others, and one shared key would keep only the first job's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum') }}
          restore-keys: go-unit-${{ runner.os }}-
      - name: make unit
        run: make unit

  race:
    name: Race
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Each job keeps its own build cache, as Omnara's matrix legs do: what the race detector builds is of no use
      # to the others, and one shared key would keep only the first job's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum') }}
          restore-keys: go-race-${{ runner.os }}-
      - name: measure
        run: |
          nproc
          go test -count=1 -run TestMeasureMigrate -v ./internal/controlplane/orchestration/ | grep -E "MEASURE|^ok"
          CGO_ENABLED=1 go test -race -count=1 -run TestMeasureMigrate -v ./internal/controlplane/orchestration/ | grep -E "MEASURE|^ok"
          CGO_ENABLED=1 go test -race -count=1 -json ./internal/controlplane/orchestration/ ./internal/controlplane/modelgateway/ ./internal/controlplane/clientapi/ > out.json || true
          python3 - <<'EOF'
          import json
          tests=[]; pk={}
          for l in open('out.json'):
              try: e=json.loads(l)
              except Exception: continue
              if e.get('Action') in ('pass','fail') and 'Elapsed' in e:
                  if e.get('Test'): tests.append((e['Elapsed'], e['Package'].split('/')[-1], e['Test']))
                  else: pk[e['Package'].split('/')[-1]]=e['Elapsed']
          print('packages', pk)
          top=[t for t in tests if '/' not in t[2]]
          for p in pk:
              mine=[t for t in top if t[1]==p]
              print(p, 'tests', len(mine), 'sum of test times', round(sum(t[0] for t in mine),1))
          top.sort(reverse=True)
          for t in top[:25]: print(t)
          EOF

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: make web-install
        run: make web-install
      - name: make web-check
        run: make web-check
      # Chromium is kept between runs, as t3code's CI keeps it: downloading it and running apt on every run was
      # most of this job, and a stalled download held a pull request for minutes.
      - name: Resolve the Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for the browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --dir web exec playwright install --only-shell chromium
      - name: Install the system packages Chromium misses
        timeout-minutes: 5
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            pnpm --dir web exec playwright install-deps chromium
          fi
      - name: make web-e2e
        timeout-minutes: 10
        run: make web-e2e

  # The one check to wait for: it passes when no job failed, the skipped ones of a documentation change
  # included (Coder's `required`).
  required:
    name: Required
    needs: [changes, static, unit, race, web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
