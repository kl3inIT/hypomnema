name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push cancels its older run; each commit pushed to main has a run of its own, since a release
# is built only from a commit whose run passed (issue #334). One group for main kept one pending run and cancelled the
# others.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed (issue #129, as Coder's `changes` job): a change of documentation alone runs none of the jobs
  # below. Documentation is pushed straight to main, and ran every check until 2026-11-10.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A file counts as code when it is neither under docs/ nor Markdown.
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'

  # The Go checks are three jobs side by side (issue #129): no reference runs them one after another, and the
  # race tests alone were most of the old Verify job. `make verify` is still the three of them, for a laptop.
  static:
    name: Static
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Each job keeps its own build cache, as Omnara's matrix legs do: what the race detector builds is of no use
      # to the others, and one shared key would keep only the first job's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-static-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum') }}
          restore-keys: go-static-${{ runner.os }}-
      # A pull request is checked against main as it is now; a push to main against the commit before it (issue
      # #334). The refspec is forced: a shallow fetch cannot tell a fast-forward, and main's runs were refused.
      - name: Fetch what the migrations are checked against
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags --depth=1 origin "+$BEFORE:refs/remotes/origin/migration-base"
          else
            git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/migration-base
          fi
      - name: make verify-static
        run: make verify-static MIGRATION_BASE=origin/migration-base
      - name: govulncheck
        run: make govulncheck

  unit:
    name: Unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Each job keeps its own build cache, as Omnara's matrix legs do: what the race detector builds is of no use
      # to the others, and one shared key would keep only the first job's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum') }}
          restore-keys: go-unit-${{ runner.os }}-
      # The box each Bot's pi runs in (issue #260) is tested on a real bubblewrap: the runner is set up as the
      # coordinator's machine is, and the test fails rather than skips when the box cannot be made.
      - name: Set up the Bots' box
        run: sudo sh deploy/coordinator/setup-box.sh "$USER"
      - name: make unit
        run: make unit
        env:
          HYPOMNEMA_BOX_TEST: required

  race:
    name: Race
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Each job keeps its own build cache, as Omnara's matrix legs do: what the race detector builds is of no use
      # to the others, and one shared key would keep only the first job's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go.sum') }}
          restore-keys: go-race-${{ runner.os }}-
      - name: make race
        run: make race

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: make web-install
        run: make web-install
      - name: make web-check
        run: make web-check
      # Chromium is kept between runs, as t3code's CI keeps it: downloading it and running apt on every run was
      # most of this job, and a stalled download held a pull request for minutes.
      - name: Resolve the Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for the browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --dir web exec playwright install --only-shell chromium
      - name: Install the system packages Chromium misses
        timeout-minutes: 5
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            pnpm --dir web exec playwright install-deps chromium
          fi
      - name: make web-e2e
        timeout-minutes: 10
        run: make web-e2e

  # The one check to wait for: it passes when no job failed, the skipped ones of a documentation change
  # included (Coder's `required`).
  required:
    name: Required
    needs: [changes, static, unit, race, web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
