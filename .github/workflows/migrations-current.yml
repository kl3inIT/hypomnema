name: Migration numbers on main

on:
  # Run the workflow and script from trusted main with a status-writing token.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths: [internal/controlplane/orchestration/migrations/**]

permissions:
  statuses: write
  pull-requests: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Publish migration status
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=()
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr "$PR_NUMBER")
          fi
          python3 .github/migrations_current.py "${args[@]}"
