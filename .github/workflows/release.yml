name: Release

# A tag v* publishes the node for every platform the install script supports, with the manifests the script
# reads, and the control plane for Linux with the manifests `hypomnema update` reads (issue #279). The script
# (GET /install/node.sh on a control plane) and the control plane's updater download from the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only a commit whose CI passed is released (issue #334): v0.9.12 was tagged on a red commit, published, and
  # refused by the control plane. Waits for the CI run of the tagged commit's push, up to 40 minutes.
  green:
    name: CI of the tagged commit passed
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 80); do
            run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push \
              --limit 1 --json status,conclusion -q '.[0] | .status + " " + .conclusion')"
            echo "CI of $GITHUB_SHA: ${run:-no run yet}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*) echo "::error::CI of the tagged commit did not pass: $run"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::no finished CI run for $GITHUB_SHA"; exit 1

  node:
    name: Node and control plane binaries
    needs: green
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: make release-node
        run: make release-node VERSION="$GITHUB_REF_NAME"
      - name: Build the web client
        run: make web-install web-build
      - name: make release-controlplane
        run: make release-controlplane VERSION="$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
