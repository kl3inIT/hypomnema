# Dependency updates (issue #54). Weekly, with minor and patch updates grouped per ecosystem so each week brings a
# few pull requests; a major version comes alone. Security updates are grouped per ecosystem too (#424). CI checks
# each one like any other pull request.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools/ci"]
    schedule: { interval: weekly }
    groups:
      go:
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web:
        update-types: [minor, patch]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Its next build is used: the releases need the JavaScript compiler API that TypeScript 7 dropped, and
      # Dependabot reads 0.0.0-next-… as older than every release (#424). A newer next build is taken by hand.
      - dependency-name: "@hey-api/openapi-ts"
      # react-pdf names the one pdf.js it runs with (11.0.0: 6.3.289) and the worker must be the same version, so
      # pdfjs-dist moves only with react-pdf, by hand (#435).
      - dependency-name: "pdfjs-dist"
  - package-ecosystem: npm
    # pi, the coordinator on the server; a new version is installed by running deploy/coordinator/setup-coordinator.sh.
    directory: /deploy/coordinator
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]
