# A worker profile on the Codex CLI, served by the control plane's model gateway (issue #107). The starting set of
# profiles runs Claude Code only, so the coordinator has a Codex worker to choose once this one is applied.
#
# Before applying, replace the two placeholders:
#   <gateway provider>  the provider of kind model_gateway: `hypomnema providers list`
#   <gateway model>     a model that provider offers:        `hypomnema models list`
# Then: hypomnema profiles apply codex-implementer.yaml
#
# The description is what the coordinator chooses by; say in it what this worker is for.
name: codex-implementer
description: >-
  Makes a narrow, well-scoped change in the repository, runs its checks and opens a pull request. Runs on Codex;
  use implementer for work across many files, refactors and writing tests.
runtime: codex
model:
  provider: <gateway provider>
  name: <gateway model>
  effort: high
