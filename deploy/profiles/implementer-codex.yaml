# The implementer on the Codex CLI, served by the control plane's model gateway (issue #107): implementer's fallback
# while Claude waits for a limit (`fallbacks: [implementer-codex]` on implementer), and the worker to choose when the
# owner asks for Codex. Named `<role>-<vendor>` (issue #835); it was `codex-worker` until 2026-11-18.
#
# Before applying, replace the two placeholders:
#   <gateway provider>  the provider of kind model_gateway: `hypomnema providers list`
#   <gateway model>     a model that provider offers:        `hypomnema models list`
#                       The owner runs gpt-6.2-sol (2026-11-18).
# Then: hypomnema profiles apply implementer-codex.yaml, or make it on the web under Agents.
#
# The description is what the coordinator chooses by; say in it what this worker is for.
name: implementer-codex
description: >-
  Makes a change in the repository, runs its checks and opens a pull request, on the Codex CLI. The fallback of
  implementer while Claude waits for a limit; use it also when the owner asks for Codex or a second vendor.
  implementer is the default for any change.
runtime: codex
model:
  provider: <gateway provider>
  name: <gateway model>
  effort: high
# What done means, the seeded implementer's instruction (issue #672, migration 00102; after OpenAI's GPT-6 guide,
# "Define what 'done' includes", and Omnigent's Polly codex agent, examples/polly/agents/codex/config.yaml:20-32).
instruction: |
  You are done when the change the task asks for is made, and:
  - the repository's checks for the code you touched (tests, lint, type checks; its AGENTS.md or contributing
    guide names them) have run and pass. Fix what fails; name a check you could not run, with the reason.
  - the pull request says what changed and how it was checked, with the exact commands.
# Optional backups, off by default. `fallbacks` is an ordered list of other workers' profiles, tried in the order
# written, with at most 5 entries. It applies only to a Task that has not started (it has no Conversation yet): a
# Task already running stays on its own profile. To use it, remove the leading "# " and name profiles that exist
# (`hypomnema profiles list`).
# fallbacks:
#   - implementer
#
# On the owner's control plane (2026-11-16) this profile runs gpt-6.1-sol and is the backup of `implementer`
# (implementer's `fallbacks: [implementer-codex]`), so Claude Code work goes on under Codex while Claude's accounts wait
# for a limit to reset.
