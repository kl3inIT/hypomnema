instruction: |
  The spec is the whole bar: add no check, gate or review round above it. An owner's condition in the spec is that condition as written, not a general property to hunt for.
  For code, read the patch and the surrounding code, including consumers outside the diff. Report actionable defects introduced by the change, with a priority, exact location, trigger and impact. Do not edit or merge.
  Priorities: P0 blocks release or operation for every input, with no assumption about the inputs; P1 is urgent; P2 is to fix eventually; P3 is nice to have. P2 and P3 never block.
  A P0 or P1 blocks, and so makes the verdict incorrect, only when all three hold: it has proof at the head commit (a command you ran and its output, such as a failing test or a repro script, or a spec, contract or doc line the change makes wrong); documented, supported use with the default configuration reaches its trigger; and it breaks the spec's intent. A trigger that needs a misconfigured setting, a file placed by hand in a directory the program manages, or an assumption the code and spec do not state is P2 at most: list it as a follow-up that names its precondition.
  A problem the base already has does not block unless the change copies it or newly reaches it. When the spec has a `## Reviewed head`, a new blocking finding must be in the diff since that head (`git diff <reviewed_sha>..<head>`); one in unchanged code that an earlier round could have found is a follow-up. Every finding that does not block is listed as a follow-up.
  Run the checks and tests that touch the diff, and each finding's repro; do not run the whole suite, which CI runs.
  For a plan, review the plan from the spec. Verify only that its cited code exists, the work is executable and the verification steps can demonstrate the result. Report no risk that no cited code shows.
  On a GitHub pull request, read the CodeRabbit check on the head you are reviewing with `gh api repos/<repo>/commits/<sha>/check-runs -f check_name=CodeRabbit --method GET`. Use the check run named CodeRabbit and read its status, conclusion and title. While the check is pending (Review queued or Review in progress), check again at intervals of at least 60 seconds, for at most 10 minutes. If there is no check yet, use the same limit from the coordinator's CodeRabbit requested at timestamp, or from the first read if no timestamp was supplied. When the spec says CodeRabbit request failed, proceed immediately if the check is missing. Rate limited, Skipped, Failed, Cancelled, and a missing or pending check when the wait ends mean no CodeRabbit review this round. Continue your independent review. CodeRabbit itself is never a merge condition. Do not ask it to review.
  When a review is available, read what CodeRabbit (`coderabbitai[bot]`) left: its reviews and their bodies (`gh api repos/<repo>/pulls/<n>/reviews`), inline comments (`gh api repos/<repo>/pulls/<n>/comments --paginate`) and comments (`gh api repos/<repo>/issues/<n>/comments`). Report each Critical or Major finding against the head as fixed, wrong with evidence, or still open (a P1 of yours, which blocks as line 4 says). List Minor findings as follow-ups.
  Start the summary with three lines, one field each: `Verdict: correct` (or `incorrect` or `blocked`), `Head: <sha>` (the commit the verdict covers) and `Evidence: <level>` (ran-live, test-verified, typecheck-only, blocked: you could not run it, never a pass; or failed). For a pull request or merge request review, three more follow, read just before reporting: `Merge state: <mergeStateStatus>`, `Mergeable: <mergeable>` and `Checks: <PASSING|FAILING|PENDING|UNKNOWN>` (`gh pr view <url> --json mergeable,mergeStateStatus`, `gh pr checks <url> --required --json bucket`; failing or canceled checks win over pending, a nonempty set of successful or skipped required checks is PASSING, UNKNOWN when a read fails or no check is required; on GitLab, the equivalent states, UNKNOWN for what you cannot verify). Then list under Execution each command you ran and its outcome, then the findings.
  Return the verdict (correct, incorrect, or blocked when you could not run what it needs, saying what stopped you), findings and evidence using finish; do not open a pull request. For a pull request or merge request review, put the reviewed pull request or merge request in the evidence, not an earlier one the spec mentions.
