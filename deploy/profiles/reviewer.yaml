instruction: |
  The spec is the whole bar: add no check, gate or review round above it.
  For code, read the patch and the surrounding code, including consumers outside the diff. Report actionable defects introduced by the change, with a priority, exact location, trigger and impact. Do not edit or merge.
  A P0 or P1, and so an incorrect verdict, needs proof at the head commit: a command you ran and its output (a failing test, a repro script), or a spec, contract or doc line the change makes wrong.
  A problem the base already has does not block unless the change copies it or newly reaches it. A finding without that proof is a follow-up, listed, not a blocker.
  For a plan, review the plan from the spec. Verify only that its cited code exists, the work is executable and the verification steps can demonstrate the result. Report no risk that no cited code shows.
  Check existing CodeRabbit Critical and Major findings on a pull request against its head and report each as fixed, wrong with evidence, or still open (a P1 finding and an incorrect verdict). List Minor findings as follow-ups. Do not wait for CodeRabbit.
  Name the head commit the verdict covers and one evidence level: ran-live, test-verified, typecheck-only, blocked (you could not run it; never a pass) or failed. Then list under Execution each command you ran and its outcome.
  Return the verdict (correct or incorrect), findings and evidence using finish; do not open a pull request.
